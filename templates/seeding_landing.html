<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Seeding - Create Tenant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #667eea;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-message {
            display: none;
            text-align: center;
        }

        .success-message h2 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .tenant-id {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 6px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
        }

        .link-button {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .link-button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="form-section">
            <h1>🌱 Customer Seeding</h1>
            <p class="subtitle">Create a new tenant and seed sample data</p>

            <div id="alert" class="alert"></div>

            <form id="seedingForm">
                <div class="form-group">
                    <label for="tenantName">Tenant Name *</label>
                    <input type="text" id="tenantName" name="tenantName" placeholder="e.g., Acme Corp" required>
                </div>

                <div class="form-group">
                    <label for="email">Contact Email *</label>
                    <input type="email" id="email" name="email" placeholder="contact@example.com" required>
                </div>

                <div class="form-group">
                    <label for="industry">Industry</label>
                    <select id="industry" name="industry">
                        <option value="Technology">Technology</option>
                        <option value="Finance">Finance</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Retail">Retail</option>
                        <option value="Manufacturing">Manufacturing</option>
                        <option value="Energy">Energy</option>
                        <option value="Telecom">Telecom</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="numCustomers">Sample Customers</label>
                        <input type="number" id="numCustomers" name="numCustomers" value="10" min="1" max="100">
                    </div>
                    <div class="form-group">
                        <label for="numOpportunities">Sample Opportunities</label>
                        <input type="number" id="numOpportunities" name="numOpportunities" value="50" min="1" max="500">
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary">Create & Seed</button>
                    <button type="reset" class="btn-secondary">Clear</button>
                </div>
            </form>

            <div id="loading" class="loading">
                <div class="spinner"></div> Creating tenant and seeding data...
            </div>
        </div>

        <div id="success-section" class="success-message">
            <h2>✓ Tenant Created Successfully!</h2>
            <p style="color: #666; margin-bottom: 10px;">Your customer seeding sandbox is ready.</p>
            <div class="tenant-id" id="tenantIdDisplay"></div>
            <p style="color: #666; font-size: 13px; margin-top: 10px;">Save this ID to access your sandbox.</p>
            <a href="" id="sandboxLink" class="link-button">Open Sandbox →</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('seedingForm');
        const alert = document.getElementById('alert');
        const loading = document.getElementById('loading');
        const formSection = document.getElementById('form-section');
        const successSection = document.getElementById('success-section');
        const tenantIdDisplay = document.getElementById('tenantIdDisplay');
        const sandboxLink = document.getElementById('sandboxLink');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const tenantName = document.getElementById('tenantName').value.trim();
            const email = document.getElementById('email').value.trim();
            const industry = document.getElementById('industry').value;
            const numCustomers = parseInt(document.getElementById('numCustomers').value);
            const numOpportunities = parseInt(document.getElementById('numOpportunities').value);

            if (!tenantName || !email) {
                showAlert('Please fill in all required fields', 'error');
                return;
            }

            loading.style.display = 'block';

            try {
                // Step 1: Create tenant
                const tenantRes = await fetch('/api/tenants', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tenant_name: tenantName,
                        email: email,
                        industry: industry
                    })
                });

                if (!tenantRes.ok) {
                    const error = await tenantRes.json();
                    throw new Error(error.message || 'Failed to create tenant');
                }

                const tenantData = await tenantRes.json();
                const tenantId = tenantData.tenant_id;

                // Step 2: Seed data
                const seedRes = await fetch(`/api/tenants/${tenantId}/seed`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        num_customers: numCustomers,
                        num_opportunities: numOpportunities
                    })
                });

                if (!seedRes.ok) {
                    throw new Error('Failed to seed data');
                }

                // Success
                loading.style.display = 'none';
                formSection.style.display = 'none';
                successSection.style.display = 'block';
                tenantIdDisplay.textContent = `Tenant ID: ${tenantId}`;
                sandboxLink.href = `/sandbox/${tenantId}`;

            } catch (error) {
                loading.style.display = 'none';
                showAlert(error.message, 'error');
            }
        });

        function showAlert(message, type) {
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';
        }
    </script>
</body>
</html>
