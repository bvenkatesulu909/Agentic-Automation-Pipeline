[project]
name = "ragstack"
version = "0.1.0"
description = "Local RAG over your documents, answered by Claude or a local model, exposed over MCP."
requires-python = ">=3.10"
dependencies = [
    # Answer synthesis. Needs output_config.effort + thinking={"type": "adaptive"};
    # both are GA on the regular (non-beta) messages endpoint. Floor is the
    # oldest release verified to type them, not the oldest that might work.
    "anthropic>=0.120",
    # MCP server (FastMCP lives in the official SDK). Upper bound is not
    # cosmetic: mcp 2.0 removed McpHttpClientFactory from
    # mcp.client.streamable_http, which google-adk 2.5 imports at module load.
    # An unpinned `>=1.2` resolves to 2.x in a clean environment and breaks every
    # MCP-using agent with an ImportError at startup.
    "mcp>=1.24,<2",
    # Vector store + similarity search.
    "numpy>=1.26",
    # PDF text extraction for .pdf documents in the corpus.
    "pypdf>=4.0",
    # .env loading in config.py.
    "python-dotenv>=1.0",
    # Local embeddings; pulls in torch + transformers + cross-encoder support.
    "sentence-transformers>=3.0",
    # LangGraph for orchestration workflows.
    "langgraph>=0.1.0",
    # SQLite vector search.
    "sqlite-vec>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The multi-agent apps in adk_apps/. Kept optional because ragstack itself — the
# CLI, the index, the MCP server — does not need any of it; only the agents do.
adk = [
    # Provides the `adk` console script the container entrypoint runs.
    "google-adk>=2.5",
    # Used directly by the agents' GCP tools for REST calls against Compute,
    # Cloud Billing, and BigQuery.
    "requests>=2.31",
    # Backs ADK's LiteLlm wrapper, which is how ADK_MODEL_PROVIDER=openrouter
    # reaches non-Gemini models. Unused on the default Vertex path, but the
    # import is lazy so it costs nothing there.
    "litellm>=1.60",
]
# Venki News — the live world desk in venki_news/. Separate from `adk` because
# it shares no runtime with the ADK apps: different SDK, different provider,
# different server. The wire layer needs only httpx and the stdlib XML parser,
# so a wire-only deployment can install this group and never hold an API key.
venki = [
    # The ten-agent newsroom. Floor is the oldest release verified to accept
    # `output_type` as a strict schema and to type RunContextWrapper the way
    # tools.py uses it.
    "openai-agents>=0.19",
    # Feed polling. Async, because nineteen feeds are polled concurrently on a
    # 60-second budget and doing it serially spends most of the minute waiting.
    "httpx>=0.27",
    # The front page and the SSE stream.
    "fastapi>=0.110",
    "uvicorn>=0.27",
    # Reads the repo .env, so the desktop launcher picks up an API key without
    # one having to be exported in whatever shell the shortcut inherits.
    "python-dotenv>=1.0",
]
# Deploying the agents to Vertex AI Agent Engine, the managed ADK runtime. Only
# needed on the machine that runs the deploy — the agents themselves do not
# import it, and it is a large dependency tree, so it stays out of `adk` and out
# of the container image.
agent-engine = [
    "google-cloud-aiplatform[agent-engines,adk]>=1.140",
]
# Cost-optimized model router with multi-provider support. Enables query-complexity
# based routing to cheap/expensive models, spend tracking via Prometheus, and an
# optional FastAPI metrics endpoint. Pull in FastAPI only if you want the
# /metrics and /router/* endpoints; the core router works without it.
router = [
    "litellm>=1.60",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
# Automated evaluation harness for RAG pipelines. Runs 100+ golden test cases,
# detects regressions, and tracks quality trends using DeepEval, RAGAS, and LangSmith.
eval = [
    "deepeval>=1.0.0",
    "ragas>=0.1.0",
    "langsmith>=0.1.0",
    "click>=8.0",
]
# Production vector database at scale: Qdrant backend, hybrid search, caching, backups.
scale = [
    "qdrant-client>=2.7.0",
    "rank-bm25>=0.2.2",
]

[project.scripts]
ragstack = "ragstack.cli:main"
pdf-qa = "ragstack.pdf_qa.cli:cli"
eval = "ragstack.eval.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: loads the real embedding model (deselect with -m 'not slow')",
]
