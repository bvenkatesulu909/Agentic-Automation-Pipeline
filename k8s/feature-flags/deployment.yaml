apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-flags
  namespace: adk-agents
  labels:
    app: feature-flags

spec:
  replicas: 2

  selector:
    matchLabels:
      app: feature-flags

  template:
    metadata:
      labels:
        app: feature-flags

    spec:
      containers:
        - name: feature-flags
          image: python:3.12-slim
          command:
            - python
            - /app/feature-flags-server.py

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: FEATURES_FILE
              value: "/etc/feature-flags/rollouts.json"

          volumeMounts:
            - name: feature-flags-config
              mountPath: /etc/feature-flags
              readOnly: true

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

      volumes:
        - name: feature-flags-config
          configMap:
            name: feature-flags-rollout

---
apiVersion: v1
kind: Service
metadata:
  name: feature-flags
  namespace: adk-agents
  labels:
    app: feature-flags

spec:
  type: ClusterIP
  selector:
    app: feature-flags

  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
