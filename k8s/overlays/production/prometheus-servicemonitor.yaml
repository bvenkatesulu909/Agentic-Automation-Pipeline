apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: adk-agents
  namespace: adk-agents
  labels:
    app: adk-agents

spec:
  selector:
    matchLabels:
      app: adk-agents

  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
