# Kustomization for vLLM inference server deployment
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

# Common labels for all resources
commonLabels:
  app: inference-server
  component: inference
  managed-by: kustomize

# Common annotations
commonAnnotations:
  description: "Production vLLM inference server with continuous batching"
  documentation: "https://docs.vllm.ai"

# Resources to include
resources:
- 01-configmap.yaml
- 02-deployment.yaml
- 03-service-ingress.yaml
- 04-autoscaling.yaml
- 05-rbac.yaml

# Image replacement (customize for your registry)
images:
- name: us.gcr.io/your-project/inference-server
  newName: us.gcr.io/YOUR-PROJECT-ID/inference-server
  newTag: v1.0.0

# Replicas override (can be overridden by overlays)
replicas:
- name: inference-server
  count: 2

# Configure Namespace
namespace: default

# Patches for environment-specific config
patchesStrategicMerge:
# Customize CPU/memory based on environment
- patch.yaml

# Vars for dynamic substitution
vars:
- name: INFERENCE_SERVER_PORT
  objref:
    kind: Service
    name: inference-server
    apiVersion: v1
  fieldref:
    fieldpath: spec.ports[0].port

# Suffix for resource names (e.g., inference-server-prod)
# nameSuffix: -prod

# ConfigMap generator (alternative to static configmap)
# Uncomment to use
# configMapGenerator:
# - name: inference-config
#   literals:
#   - MODEL_NAME=meta-llama/Llama-2-70b-hf
#   - GPU_MEMORY_UTILIZATION=0.95

# Secret generator (for API keys, tokens)
# Use Sealed Secrets or External Secrets in production
# secretGenerator:
# - name: inference-secrets
#   literals:
#   - HF_TOKEN=<your-token>

# Generate metadata (hash-based config tracking)
generatorOptions:
  disableNameSuffixHash: false
  annotations:
    config-hash: "true"
