apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adk-agents-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/bvenkatesulu909/adk-agents
    targetRevision: main
    path: k8s/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: adk-agents

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

  notifications:
    - destinations:
        - github
        - slack

  info:
    - name: 'GitHub'
      value: https://github.com/bvenkatesulu909/adk-agents
    - name: 'Documentation'
      value: https://github.com/bvenkatesulu909/adk-agents/blob/main/README.md
