# ADK agent apps on GKE.
#
# Credentials come from Workload Identity: the Kubernetes ServiceAccount below is
# bound to a Google service account, and the pod gets tokens from the metadata
# server. No key file is mounted, and none is baked into the image — a downloaded
# service-account key would be a long-lived credential sitting in a container.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adk-agents
  annotations:
    iam.gke.io/gcp-service-account: adk-agents@venkatesh-68cb677e.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adk-agents
  labels:
    app: adk-agents
spec:
  # One replica: the node is a single e2-medium and the image wants ~1.5 GB for
  # torch plus the embedding model. A second replica would not schedule.
  replicas: 1
  selector:
    matchLabels:
      app: adk-agents
  template:
    metadata:
      labels:
        app: adk-agents
    spec:
      serviceAccountName: adk-agents
      containers:
        - name: adk-agents
          # Pinned by digest rather than the :v1 tag — a tag can be moved and a
          # pod restart would then silently pull different code.
          # v7 — the first image carrying billing_app and sales_app. Earlier
          # tags serve only the three Gemini apps.
          image: us-west1-docker.pkg.dev/venkatesh-68cb677e/adk/adk-agents@sha256:845d46baf8ea3088ace2a5f88d79eef2f812a016379a4e06b3982af2c2e98096
          ports:
            - containerPort: 8000
          env:
            # "vertex" (default) uses Workload Identity and needs no key. Set to
            # "openrouter" to route every agent through OpenRouter instead.
            - name: ADK_MODEL_PROVIDER
              value: "vertex"
            # Paid model — needs credits on the OpenRouter account. Supports
            # tool calling, which most cheap models do not.
            - name: OPENROUTER_MODEL
              value: "tencent/hy3"
            # billing_app reads its own two variables instead of the shared
            # ones, so the "vertex" setting above keeps the other three apps on
            # Gemini without dragging this one off tencent/hy3. Set this to
            # "vertex" to put it on Gemini as well.
            - name: BILLING_APP_PROVIDER
              value: "openrouter"
            - name: BILLING_APP_MODEL
              value: "tencent/hy3"
            # sales_app is pinned the same way and for the same reason. Both it
            # and billing_app therefore need the Secret below to be present;
            # setting these to "vertex" puts them on Gemini with no key.
            - name: SALES_APP_PROVIDER
              value: "openrouter"
            - name: SALES_APP_MODEL
              value: "tencent/hy3"
            # optional:true so the pod still starts when the Secret is absent,
            # which is the normal state on the Vertex path. Note that billing_app
            # and sales_app are the exceptions: both default to OpenRouter, so
            # without this Secret those two raise on load while the rest keep
            # working.
            # The key is never in this file, the image, or the repo — create it:
            #   kubectl create secret generic openrouter --from-literal=api-key=YOUR_KEY
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openrouter
                  key: api-key
                  optional: true
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              # GKE reserves roughly 1 GB of the node's 4 GB, so this is close to
              # the ceiling of what will actually schedule here.
              memory: 2500Mi
          # The embedding model takes ~35s to load before the server is useful.
          # A startup probe with a generous budget stops the kubelet killing the
          # container mid-load, which a plain liveness probe would do.
          startupProbe:
            httpGet:
              path: /list-apps
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /list-apps
              port: 8000
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /list-apps
              port: 8000
            periodSeconds: 30
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: adk-agents
spec:
  # LoadBalancer provisions a public IP and a forwarding rule, which bills
  # separately from the cluster. Switch to ClusterIP and use `kubectl port-forward`
  # if the endpoint does not need to be reachable from the internet.
  type: LoadBalancer
  selector:
    app: adk-agents
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
