apiVersion: v1
kind: ConfigMap
metadata:
  name: flagger-alerts
  namespace: flagger-system

data:
  alerts.yaml: |
    apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: flagger.rules
      namespace: flagger-system
    spec:
      groups:
        - name: flagger.rules
          interval: 1m
          rules:
            - alert: CanaryRevisionMismatch
              expr: count(count by (targetref_name) (flagger_canary_info)) by (targetref_name) > 1
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Multiple canary revisions detected"
                description: "Canary {{ $labels.targetref_name }} has multiple revisions"

            - alert: CanaryAnalysisFailed
              expr: flagger_canary_status_phase{phase="Failed"} > 0
              for: 1m
              labels:
                severity: critical
              annotations:
                summary: "Canary analysis failed"
                description: "Canary {{ $labels.name }} in namespace {{ $labels.namespace }} failed analysis"

            - alert: CanaryMetricProviderDown
              expr: increase(flagger_metrics_provider_errors_total[5m]) > 0
              labels:
                severity: warning
              annotations:
                summary: "Metrics provider error"
                description: "Unable to query metrics from {{ $labels.provider }}"
