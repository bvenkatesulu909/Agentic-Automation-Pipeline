[pytest]
# Pytest configuration for CrewAI Tool Tracer tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for organizing tests
markers =
    unit: Unit tests for core functionality
    integration: Integration tests with CrewAI
    async: Asynchronous tool execution tests
    benchmark: Performance benchmarks
    slow: Slow running tests
    exported: Tests for export functionality
    decorators: Tests for decorator functionality
    slo: SLO monitoring tests

# Async support
asyncio_mode = auto

# Coverage options
addopts =
    --verbose
    --strict-markers
    --disable-warnings
    --tb=short
    -ra

# Timeout for tests (prevent hangs)
timeout = 30

# Minimum Python version
minversion = 3.8
