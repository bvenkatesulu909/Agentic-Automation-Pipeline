name: Deploy - ArgoCD Sync

on:
  push:
    branches: [main, develop]
    paths:
      - 'k8s/**'
      - '.github/workflows/deploy.yml'
  workflow_run:
    workflows: ["CI - Test & Build"]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - canary
          - production

env:
  REGISTRY: us-west1-docker.pkg.dev
  GCP_PROJECT_ID: venkatesh-68cb677e

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Determine deployment environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "cluster=adk-prod-cluster" >> $GITHUB_OUTPUT
            echo "region=us-west1" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "cluster=adk-staging-cluster" >> $GITHUB_OUTPUT
            echo "region=us-west1" >> $GITHUB_OUTPUT
          fi

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ steps.env.outputs.cluster }} \
            --region ${{ steps.env.outputs.region }} \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          ./argocd version --client

      - name: Sync ArgoCD applications
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          ./argocd app sync adk-agents-${{ steps.env.outputs.environment }} \
            --prune \
            --force \
            --timeout 5m

      - name: Wait for ArgoCD sync
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          ./argocd app wait adk-agents-${{ steps.env.outputs.environment }} \
            --timeout 10m \
            --sync

      - name: Get deployment status
        run: |
          kubectl get deployments -n adk-agents
          kubectl get pods -n adk-agents
          kubectl rollout status deployment/adk-agents -n adk-agents --timeout=5m

      - name: Post deployment metrics
        run: |
          echo "Deployment completed for environment: ${{ steps.env.outputs.environment }}"
          echo "Cluster: ${{ steps.env.outputs.cluster }}"
          echo "Region: ${{ steps.env.outputs.region }}"

  canary-analysis:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials adk-prod-cluster \
            --region us-west1 \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Fetch Prometheus metrics
        run: |
          # Wait 2 minutes for initial metrics to be collected
          sleep 120

          # Check error rate
          ERROR_RATE=$(kubectl exec -n monitoring prometheus-0 -- \
            promtool query instant 'rate(http_requests_total{status=~"5.."}[5m])' 2>/dev/null || echo "0")

          # Check latency (p95)
          LATENCY_P95=$(kubectl exec -n monitoring prometheus-0 -- \
            promtool query instant 'histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))' 2>/dev/null || echo "0")

          echo "error_rate=$ERROR_RATE" >> $GITHUB_ENV
          echo "latency_p95=$LATENCY_P95" >> $GITHUB_ENV

      - name: Evaluate quality gates
        run: |
          python3 << 'EOF'
          import json
          import os

          error_rate = float(os.getenv('error_rate', '0'))
          latency_p95 = float(os.getenv('latency_p95', '0'))

          thresholds = {
              'error_rate': 0.05,  # 5% max error rate
              'latency_p95': 2.0   # 2s max P95 latency
          }

          failures = []
          if error_rate > thresholds['error_rate']:
              failures.append(f"Error rate {error_rate:.2%} exceeds threshold {thresholds['error_rate']:.2%}")

          if latency_p95 > thresholds['latency_p95']:
              failures.append(f"P95 latency {latency_p95:.2f}s exceeds threshold {thresholds['latency_p95']:.2f}s")

          if failures:
              print(f"::error::Quality gates failed:")
              for msg in failures:
                  print(f"  - {msg}")
              exit(1)
          else:
              print("✅ All quality gates passed")
          EOF

  rollback-on-failure:
    runs-on: ubuntu-latest
    needs: canary-analysis
    if: failure() && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials adk-prod-cluster \
            --region us-west1 \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Trigger ArgoCD rollback
        run: |
          kubectl patch deployment adk-agents -n adk-agents \
            -p '{"spec":{"template":{"metadata":{"annotations":{"rollback":"triggered"}}}}}'

          kubectl rollout undo deployment/adk-agents -n adk-agents
          kubectl rollout status deployment/adk-agents -n adk-agents --timeout=5m

      - name: Notify rollback
        run: |
          echo "⚠️ Automatic rollback triggered due to quality gate failures"
          echo "Previous stable version restored"

