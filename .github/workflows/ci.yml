name: CI - Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: us-west1-docker.pkg.dev
  GCP_PROJECT_ID: venkatesh-68cb677e
  IMAGE_NAME: adk-agents

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[adk]"
          pip install pytest pytest-cov pytest-asyncio

      - name: Run unit tests
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
        timeout-minutes: 15

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Check code quality
        run: |
          pip install ruff
          ruff check src/ --exit-zero
          ruff format --check src/ --exit-zero

      - name: Security checks
        run: |
          pip install bandit
          bandit -r src/ -ll --exit-zero

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 45
    if: github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Configure Docker to use gcloud as credential helper
        run: |
          gcloud auth configure-docker us-west1-docker.pkg.dev

      - name: Extract metadata
        id: meta
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}
          VERSION=$(echo ${GITHUB_SHA::8})
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tags=$IMAGE:$VERSION,$IMAGE:latest" >> $GITHUB_OUTPUT

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "env=staging" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Create deployment artifact
        run: |
          mkdir -p artifacts
          cat > artifacts/deployment.json << EOF
          {
            "image": "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}",
            "sha": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF#refs/heads/}",
            "environment": "${{ steps.meta.outputs.env }}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v3
        with:
          name: deployment-info
          path: artifacts/deployment.json
          retention-days: 30

  quality-gate:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()

    steps:
      - name: Check test status
        if: needs.test.result == 'failure'
        run: |
          echo "::error::Tests failed - quality gate blocking deployment"
          exit 1

      - name: Check build status
        if: needs.build-and-push.result == 'failure'
        run: |
          echo "::error::Build failed - quality gate blocking deployment"
          exit 1

      - name: Notify quality gate pass
        run: echo "✅ Quality gate passed - ready for deployment"
