name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 */6 * * *'

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[adk]"
          pip install pytest pytest-asyncio pytest-xdist

      - name: Wait for services
        run: |
          python -c "
          import socket
          import time

          services = [('localhost', 5432), ('localhost', 6379)]
          for host, port in services:
              for _ in range(30):
                  try:
                      sock = socket.create_connection((host, port), timeout=1)
                      sock.close()
                      print(f'✓ {host}:{port} is ready')
                      break
                  except:
                      time.sleep(1)
          "

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          REDIS_URL: redis://localhost:6379
        run: |
          pytest tests/integration -v \
            --tb=short \
            -n auto \
            --timeout=300

      - name: Generate coverage report
        if: always()
        run: |
          pip install coverage
          coverage report

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[adk]"
          pip install pytest-asyncio httpx

      - name: Start application
        run: |
          adk web adk_apps --port 8000 &
          sleep 10
          curl -f http://localhost:8000/list-apps || exit 1

      - name: Run E2E tests
        run: |
          pytest tests/e2e -v --tb=short --timeout=300

      - name: Collect application logs
        if: always()
        run: |
          mkdir -p logs
          # Add application log collection here
          echo "E2E tests completed"
