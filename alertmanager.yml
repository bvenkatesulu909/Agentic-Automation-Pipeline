global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'

templates:
  - '/etc/alertmanager/templates/*.tmpl'

route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  routes:
    # Critical alerts go to PagerDuty
    - match:
        severity: critical
      receiver: 'pagerduty'
      group_wait: 0s
      repeat_interval: 1h

    # Warning alerts go to Slack
    - match:
        severity: warning
      receiver: 'slack-warnings'
      group_wait: 30s
      repeat_interval: 4h

    # Info alerts go to email
    - match:
        severity: info
      receiver: 'email'
      repeat_interval: 24h

    # Cost alerts get special handling
    - match_re:
        alertname: '(HighCostPerRequest|LLMCostSpike)'
      receiver: 'cost-team'
      repeat_interval: 6h

inhibit_rules:
  # Inhibit warning alerts when critical alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

  # Inhibit info alerts when warning or critical is firing
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'cluster', 'service']

receivers:
  - name: 'default'
    slack_configs:
      - channel: '#alerts'
        title: 'Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: 'slack-warnings'
    slack_configs:
      - channel: '#warnings'
        title: 'Warning: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        send_resolved: true

  - name: 'pagerduty'
    pagerduty_configs:
      - service_key: '${PAGERDUTY_SERVICE_KEY}'
        description: '{{ .GroupLabels.alertname }}: {{ .Alerts.Firing | len }} firing'

  - name: 'cost-team'
    slack_configs:
      - channel: '#cost-alerts'
        title: '💰 Cost Alert: {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}\nValue: {{ .Annotations.summary }}{{ end }}'
        send_resolved: true

  - name: 'email'
    email_configs:
      - to: '${ALERT_EMAIL}'
        from: 'alerts@observability.local'
        smarthost: '${SMTP_HOST}:${SMTP_PORT}'
        auth_username: '${SMTP_USER}'
        auth_password: '${SMTP_PASSWORD}'
        html: |
          <html>
          <head>
            <style>
              body { font-family: Arial, sans-serif; }
              .critical { color: red; font-weight: bold; }
              .warning { color: orange; font-weight: bold; }
              .info { color: blue; }
            </style>
          </head>
          <body>
            {{ range .Alerts }}
            <div class="{{ .Labels.severity }}">
              <strong>{{ .Labels.alertname }}</strong>
              <p>{{ .Annotations.description }}</p>
              <p>Timestamp: {{ .StartsAt }}</p>
            </div>
            {{ end }}
          </body>
          </html>
