[pytest]
# Pytest configuration for ragstack with eval harness integration

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    eval: marks tests as evaluation harness tests (run with '-m eval')
    eval_slow: marks evaluation tests as slow (deselect with '-m "not eval_slow"')
    eval_regression: regression detection tests
    integration: integration tests (skip with '-m "not integration"')
    unit: unit tests

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Coverage options (if using pytest-cov)
# --cov=src/ragstack
# --cov-report=html
# --cov-report=term-missing

# Eval harness options
eval_skip_slow = false
eval_category = null
eval_results_dir = eval_results

# Timeout for long-running tests (in seconds)
# Requires pytest-timeout
timeout = 300
timeout_method = thread

# Logging
log_cli = false
log_cli_level = INFO
log_level = DEBUG

# Disable plugin warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
